name: '🚀 Publish (Unstable) Plugin'

on:
  push:
    branches:
      - unstable
  workflow_dispatch:

jobs:
  call:
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/publish-unstable.yaml@987f20aa35d3a6c9b3091616c9b3488a3ea897dc # master
    secrets:
      deploy-host: ${{ secrets.REPO_HOST }}
      deploy-user: ${{ secrets.REPO_USER }}
      deploy-key: ${{ secrets.REPO_KEY }}
      token: ${{ secrets.JF_BOT_TOKEN }}
